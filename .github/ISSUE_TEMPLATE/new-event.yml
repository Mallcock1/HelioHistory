name: Propose a new event
description: Suggest a space weather event to add to the catalogue
title: "[Event] <year> <name>"
labels: ["data", "new-event"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an event! Sourcing is required — please include
        references for the key figures. You can also open a pull request
        directly with a `data/events/<id>.json` file (see CONTRIBUTING.md).
  - type: input
    id: name
    attributes:
      label: Event name
      placeholder: "May 2024 Gannon Superstorm"
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Date(s)
      placeholder: "2024-05-10 to 2024-05-12"
    validations:
      required: true
  - type: textarea
    id: indices
    attributes:
      label: Key figures
      description: Any of peak Dst, Kp, flare class, CME speed, NOAA scales, etc.
      placeholder: "Peak Dst ≈ -412 nT; Kp 9; G5; flare X5.8"
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: Sources (required)
      description: Papers (DOIs preferred) and/or authoritative data centres.
      placeholder: "doi:10.1029/..., WDC Kyoto Dst, NOAA SWPC"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Impacts / notes
    validations:
      required: false
